# --- Defaults ---

# --- pymarl options ---
runner: "episode" # Runs 1 env for an episode
mac: "clean_mac" # Clean controller
env: "sc2" # Environment name
env_args: {} # Arguments for the environment
batch_size_run: 1 # Number of environments to run in parallel
test_nepisode: 20 # Number of episodes to test for
test_interval: 2000 # Test after {} timesteps have passed
test_greedy: True # Use greedy evaluation (if False, will set epsilon floor to 0
log_interval: 2000 # Log summary of stats after every {} timesteps
runner_log_interval: 2000 # Log runner stats (not test stats) every {} timesteps
learner_log_interval: 2000 # Log training stats every {} timesteps
t_max: 10000 # Stop running after this many timesteps
use_cuda: True # Use gpu by default unless it isn't available
buffer_cpu_only: True # If true we won't keep all of the replay buffer in vram
torch_num_threads: null # Optional cap for PyTorch CPU worker threads
torch_num_interop_threads: null # Optional cap for PyTorch inter-op threads
cuda_benchmark: True # Let cuDNN autotune kernels when CUDA is enabled
cuda_deterministic: False # Set True only when strict deterministic CUDA behavior is needed
cuda_allow_tf32: True # Use TensorFloat-32 matmul/convolution on Ampere+ GPUs
float32_matmul_precision: "high" # PyTorch 2.x matmul precision hint
use_amp: False # Enable CUDA mixed precision for learner forward/backward

# --- Logging options ---
use_tensorboard: False # Log results to tensorboard
use_wandb: True # Log results to W&B
wandb_team: null # W&B team/entity name (null uses your default account)
wandb_project: "gomarl" # W&B project name
wandb_mode: "offline" # W&B mode: "offline" or "online"
wandb_run_name: null # Optional explicit W&B run name (defaults to `name` when null)
wandb_save_model: False # Save checkpoints into W&B run directory
save_model: False # Save the models to disk
save_model_interval: 2000000 # Save models after this many timesteps
save_model_at_end: False # Save one final checkpoint at the end of training
unique_token_override: null # Optional fixed run token, useful for predictable checkpoint paths
checkpoint_path: "" # Load a checkpoint from this path
evaluate: False # Evaluate model for test_nepisode episodes and quit (no training)
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
save_replay: False # Saving the replay of the model loaded from checkpoint_path
local_results_path: "results" # Path for local results
save_battle_trace: False # Periodically render one traced test episode
battle_trace_interval: 1000000 # Trace/upload interval in environment steps
battle_trace_dir: "" # Empty means results/battle_traces/<unique_token>
battle_trace_upload_wandb: True # Upload trace media when W&B is enabled
battle_trace_make_video: True # Try to render mp4/gif in addition to PNG summaries
battle_trace_frame_stride: 1 # Render every Nth environment frame into video
battle_trace_fps: 6 # Video playback FPS
battle_trace_similarity_sample_size: 256 # Max agent-time samples for similarity heatmaps

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 32 # Size of the replay buffer
# Number of learner updates after each parallel rollout collection. Keep this at
# one for legacy runs; high-worker CPU profiles raise it to preserve the
# update-per-episode ratio when batch_size_run increases.
learner_updates_per_collect: 1
lr: 0.0005 # Learning rate for agents
critic_lr: 0.0005 # Learning rate for critics
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm

# --- Agent parameters ---
agent: "clean_hyper" # Default clean hyper agent
rnn_hidden_dim: 64 # Size of hidden state for the shared trunk
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation
clean_model_type: "baseline"
learner: "clean_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64

# --- Experiment running params ---
repeat_id: 1
label: "default_label"

run: "default"
