# Pinned PyMARL2 qmix.yaml model/optimizer configuration. This is NOT the
# original PyMARL one-step/RMSProp recipe. Old clean_hyper runs are untouched.
official_qmix_upstream_commit: "8ccac7c5aa134422a2e3009be735d23cdf8ce2f8"
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
runner: "parallel"
run: "default"
batch_size_run: 8
buffer_size: 5000
batch_size: 128
t_max: 10050000
target_update_interval: 200
mac: "official_pymarl2_mac"
agent: "official_pymarl2_rnn"
agent_output_type: "q"
learner: "official_pymarl2_qmix"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
rnn_hidden_dim: 64
obs_agent_id: True
obs_last_action: True
optimizer: "adam"
lr: 0.001
td_lambda: 0.6
gamma: 0.99
grad_norm_clip: 10
double_q: True
q_lambda: False
qmix_pos_func: "abs"
use_layer_norm: False
use_orthogonal: False
gain: 0.01
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False
learner_updates_per_collect: 1
use_amp: False
test_greedy: True
test_noise: 0.0
test_nepisode: 32
test_interval: 10000
# Scalar-only strict baseline: no custom probing, gate, or extra test rollouts.
test_battle_videos: False
test_visualizations_required: False
test_policy_importance: False
test_hyper_obs_importance: False
test_value_diagnostics: False
wandb_test_gate_trajectory: False
wandb_test_parameter_pca: False
save_model: False
save_model_at_end: False
wandb_save_model: False
name: "official_pymarl2_qmix"
