# Higher-utilization GPU profile for a single GPU with limited CPU workers.
# It keeps the algorithm unchanged and uses a conservative large training
# batch. Larger values such as batch_size=256 can OOM on long SMAC episodes.

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: "parallel"
run: "default"
batch_size_run: 8
buffer_size: 6000
batch_size: 160
optimizer: "adam"

use_cuda: True
buffer_cpu_only: True
torch_num_threads: 1
torch_num_interop_threads: 1
cuda_benchmark: True
cuda_deterministic: False
cuda_allow_tf32: True
float32_matmul_precision: "high"

save_battle_trace: False
battle_trace_interval: 1000000
battle_trace_upload_wandb: True
battle_trace_make_video: True
battle_trace_frame_stride: 1
battle_trace_fps: 6
battle_trace_similarity_sample_size: 256

t_max: 10050000
target_update_interval: 200

mac: "clean_mac"
agent: "clean_hyper"
agent_output_type: q
learner: "clean_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
hypernet_layers: 2

clean_model_type: "baseline"
clean_apply_hypermarl_init: False
clean_condition_dim: 64
clean_id_embed_dim: 64
clean_hyper_mlp_hidden_dim: 64
clean_rpg_interaction_hidden_dim: 16
clean_rpg_interaction_experts: 4
clean_rpg_residual_gate_bias: -1.0
clean_smooth_head_loss_coef: 0.01
clean_smooth_head_knn: 4
clean_smooth_head_sample_size: 256
clean_relation_mixer_gate: False
clean_route_num: 4
clean_route_temperature: 1.0
clean_rpg_relation_dim: 64
clean_graph_node_dim: 64
clean_graph_layers: 1
clean_graph_topk: null

lr: 0.001
td_lambda: 0.6

name: "clean_hyper_gpu_high_util_baseline"
