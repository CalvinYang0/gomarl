# --- Clean hypernetwork family ---

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: "parallel"
run: "default"
batch_size_run: 8
buffer_size: 5000
batch_size: 128
optimizer: "adam"

t_max: 10050000
target_update_interval: 200

mac: "clean_mac"
agent: "clean_hyper"
agent_output_type: q
learner: "clean_learner"
mixer: "qmix"                 # qmix | vdn | none
mixing_embed_dim: 32
hypernet_embed: 64
hypernet_layers: 2

# Clean model variants:
# - baseline: local hypernetwork condition from obs + prev_action + h (CTDE)
# - hypermarl_id: id-conditioned dynamic-head baseline; learned e_i only provides
#                 a condition vector for the generated head, so this is NOT the strict
#                 HyperMARL-equivalent architecture (CTDE)
# - hypermarl_fullnet: HyperMARL-style learned e_i table feeds an MLP hypernetwork
#                      that generates the full post-RNN two-layer action network
#                      parameters; shared trunk does not consume one-hot agent id (CTDE)
# - dynamic_route: local route/codebook selects the head condition (CTDE)
# - local_structured_hypercond: control model for isolating the structured maker.
#                               It keeps the baseline local condition source
#                               (obs + prev_action + h), but replaces the unified
#                               generated head with the same ego-action /
#                               enemy-interaction maker split used by
#                               rpg_structured_hypercond. It does NOT use the
#                               RPG relation capturer.
# - local_linear_interaction_hypercond: control model for isolating the relation
#                                       pattern input in the current lightweight
#                                       interaction maker. It keeps the baseline
#                                       local condition source
#                                       (obs + prev_action + h), uses the same
#                                       generated ego branch, and generates the
#                                       same one-layer interaction scorer as
#                                       rpg_linear_interaction_hypercond.
# - rpg_relation_hypercond: RPG-inspired single-task CTDE adaptation. It uses
#                           observation-only self/teammate/other relation capture,
#                           first-person cross-attention, and a separate relation GRU
#                           to produce a continuous relation pattern that conditions
#                           our generated head. It does NOT reproduce RPG's continual-
#                           learning regularizers, task embedding, or structured
#                           ego/interaction decision-maker split.
# - rpg_relation_route: same RPG-inspired relation capturer, but the relation
#                       pattern is first converted into route logits and then
#                       selects a learned route/codebook embedding before head
#                       generation. This is a relation-routed codebook variant,
#                       not an RPG reproduction and not HyperMARL-style agent-id e_i.
# - rpg_structured_hypercond: RPG-inspired structured maker. It keeps the same
#                             relation capturer, then splits the decision-maker
#                             into an ego-action branch and an enemy-interaction
#                             branch. The ego branch is condition-generated,
#                             while the interaction branch is a shared scorer
#                             conditioned on the relation pattern and enemy
#                             tokens. This mimics RPG's maker split, but does
#                             NOT fully reproduce its original hypernetwork
#                             parameterization.
# - rpg_full_structured_hypercond: corrected RPG-inspired structured maker.
#                                  Both the ego-action branch and the
#                                  enemy-interaction branch are generated from
#                                  the relation pattern by hypernetworks. This is
#                                  the closer comparison to RPG's hypernetwork
#                                  decision-maker split.
# - rpg_readout_structured_hypercond: lighter structured maker. The enemy
#                                     interaction branch uses a fixed encoder
#                                     for [agent hidden, enemy token], while
#                                     the relation pattern generates only the
#                                     final readout layer.
# - rpg_linear_interaction_hypercond: lighter structured maker. The enemy
#                                     interaction branch is a single linear
#                                     layer generated from the relation
#                                     pattern, applied to [agent hidden,
#                                     enemy token]. This removes the generated
#                                     interaction bottleneck layer.
# - rpg_flat_interaction_hypercond: ablation of the target-wise interaction
#                                   scorer. It keeps the RPG ego/interaction
#                                   split and relation-conditioned generated
#                                   interaction layer, but outputs all enemy
#                                   attack Q-values at once from the agent
#                                   hidden state instead of scoring each
#                                   enemy token separately.
# - rpg_public_relation_hypercond: same maker as rpg_linear_interaction_hypercond,
#                                  but the relation pattern is generated from
#                                  observer-invariant public fields extracted
#                                  from local self/ally/enemy slots. It keeps
#                                  health/shield/type but drops private
#                                  self-view fields such as movement context,
#                                  relative position, attack availability, and
#                                  ally last action.
# - rpg_private_interaction_input_hypercond: same relation generator and
#                                            hypernetwork as
#                                            rpg_linear_interaction_hypercond,
#                                            but the generated interaction head
#                                            is applied to a private target
#                                            token encoded from movement context,
#                                            target attack availability, and
#                                            target relative geometry. It drops
#                                            public health/shield/type fields.
# - rpg_global_filled_obs_hypercond: same model structure as
#                                    rpg_linear_interaction_hypercond, but
#                                    during non-test training it replaces the
#                                    relation-generator observation with an
#                                    obs-shaped globally filled observation.
#                                    Decentralized test execution still uses
#                                    the original local observation.
# - rpg_relation_distill_hypercond: same execution path as
#                                   rpg_linear_interaction_hypercond, plus a
#                                   training-only centralized relation teacher.
#                                   The teacher uses global state and agent id
#                                   to generate auxiliary relation conditions,
#                                   learns through an auxiliary Q-learning loss,
#                                   and distills local relation conditions
#                                   without changing decentralized execution.
# - rpg_public_delta_aux_hypercond: same maker as rpg_linear_interaction_hypercond,
#                                  plus a training-only auxiliary predictor from
#                                  relation hidden state to next-step public
#                                  health/shield deltas. Unit type is not
#                                  predicted, and ally/enemy loss is computed
#                                  only for entity slots visible at both t and
#                                  t+1.
# - rpg_entity_token_decision_head_hypercond: RPG relation generator and
#                                             hypernetwork-conditioned heads,
#                                             but Q-head inputs do not use the
#                                             policy GRU hidden. Ego actions
#                                             use the self token; attack action
#                                             j uses only enemy token j.
# - rpg_self_enemy_pair_token_decision_head_hypercond: same no-policy-hidden
#                                                      ablation, but attack
#                                                      action j uses
#                                                      [self token, enemy token
#                                                      j].
# - rpg_relation_token_decision_head_hypercond: replaces policy GRU hidden in
#                                               both ego and interaction heads
#                                               with the temporal relation
#                                               hidden state.
# - rpg_policy_relation_fusion_head_hypercond: keeps the RPG relation generator
#                                              and target-wise decision maker,
#                                              but Q-head inputs use a fused
#                                              token from [policy GRU hidden,
#                                              temporal relation hidden].
# - rpg_public_transformer_hypercond: same structured decision maker as
#                                     rpg_linear_interaction_hypercond, but
#                                     replaces RPG cross-attention relation
#                                     generation with a public self/ally/enemy
#                                     entity-token Transformer. Public tokens
#                                     keep presence, health/shield, and unit
#                                     type only.
# - rpg_public_future_delta_token_transformer_hypercond: public Transformer
#                                                        relation generator
#                                                        with predicted
#                                                        next-public delta
#                                                        added as token
#                                                        embeddings. The
#                                                        predictor uses
#                                                        obs_{t-1}, obs_t and a
#                                                        GRU; true obs_{t+1}
#                                                        is used only for an
#                                                        auxiliary loss.
# - rpg_public_future_delta_bias_transformer_hypercond: same future-delta
#                                                       signal, injected as
#                                                       attention bias.
# - rpg_public_private_token_transformer_hypercond: public Transformer with
#                                                   current private local fields
#                                                   injected as token
#                                                   embeddings.
# - rpg_public_private_bias_transformer_hypercond: current private local fields
#                                                  injected as attention bias.
# - rpg_public_private_bias_friend_public_transformer_hypercond: same
#                                                  private-bias public
#                                                  Transformer, but public
#                                                  side embeddings merge self
#                                                  and ally into one friendly
#                                                  identity.
# - rpg_public_private_owner_bias_transformer_hypercond: same friendly public
#                                                  tokens, but self/ally/enemy
#                                                  identity is moved into the
#                                                  private bias embedding. The
#                                                  old side-pair bias table is
#                                                  disabled.
# - rpg_public_private_simple_bias_transformer_hypercond: same owner-private
#                                                  setup, but private bias is a
#                                                  simple per-token learned
#                                                  attention bias instead of
#                                                  pairwise MLP.
# - rpg_public_private_simple_bias_transformer_q_residual_hypercond: same
#                                                  owner-private simple-bias
#                                                  relation generator, but the
#                                                  generated decision head only
#                                                  provides a gated Q residual
#                                                  on top of a fixed base head.
# - rpg_public_private_simple_bias_transformer_param_residual_hypercond: same
#                                                  owner-private simple-bias
#                                                  relation generator, but the
#                                                  generated parameters are a
#                                                  gated residual update to a
#                                                  fixed base head.
# - rpg_public_private_simple_bias_transformer_param_residual_l2_hypercond:
#                                                  same as param_residual, plus
#                                                  an L2 penalty on the gated
#                                                  generated residual weights.
# - rpg_public_private_simple_bias_transformer_param_residual_smooth_hypercond:
#                                                  same as param_residual, but
#                                                  smoothness is applied to the
#                                                  gated residual weights rather
#                                                  than the full generated head.
# - rpg_public_private_simple_bias_transformer_param_residual_l2_smooth_hypercond:
#                                                  combines residual L2 and
#                                                  residual smoothness.
# - rpg_public_private_simple_bias_transformer_smooth_hypercond: same
#                                                  owner-private simple-bias
#                                                  relation generator and head,
#                                                  plus relation-to-head
#                                                  smoothness regularization.
# - rpg_simple_bias_observer_consistency_router_hypercond: unchanged simple-bias
#                                                  public Transformer with a
#                                                  raw-slot split learned from
#                                                  observer consistency.
# - rpg_simple_bias_temporal_stability_router_hypercond: same controlled split,
#                                                  scored by temporal stability.
# - rpg_simple_bias_gradient_importance_router_hypercond: same controlled split,
#                                                  scored by absolute TD gradient.
# - rpg_simple_bias_gradient_importance_critical_router_hypercond: preserves the
#                                                  same architecture, scores
#                                                  each raw slot with mean plus
#                                                  episode top-tail attribution,
#                                                  and softly mixes TOKEN/BIAS
#                                                  without an audit rollout.
# - rpg_simple_bias_gradient_importance_learnable_threshold_router_hypercond:
#                                                  same score and architecture,
#                                                  but TD loss learns the scalar
#                                                  TOKEN/BIAS threshold.
# - rpg_simple_bias_gradient_importance_inverse_router_hypercond: identical
#                                                  TOKEN budget, assigned to
#                                                  the lowest-scoring slots.
# - rpg_simple_bias_gradient_consistency_router_hypercond: same controlled split,
#                                                  scored by gradient consistency.
# - rpg_simple_bias_parameter_sensitivity_router_hypercond: same controlled split,
#                                                  scored by generated-parameter
#                                                  sensitivity.
# - rpg_simple_bias_parameter_sensitivity_learnable_threshold_router_hypercond:
#                                                  same sensitivity score, with
#                                                  a TD-learned scalar threshold.
# - rpg_simple_bias_parameter_sensitivity_inverse_router_hypercond: identical
#                                                  TOKEN budget, assigned to
#                                                  the least-sensitive slots.
# - rpg_simple_bias_counterfactual_router_hypercond: same controlled split,
#                                                  scored by the signed first-
#                                                  order TOKEN-vs-BIAS TD-loss
#                                                  route gradient.
# - rpg_public_private_selfattn_bias_transformer_hypercond: same owner-private
#                                                  setup, but private tokens run
#                                                  one self-attention block
#                                                  before producing the simple
#                                                  attention bias.
# - rpg_public_private_bias_transformer_pair_interaction_hypercond: same
#                                                                  relation
#                                                                  generator,
#                                                                  but the
#                                                                  interaction
#                                                                  head keeps
#                                                                  policy
#                                                                  hidden h_i
#                                                                  and appends
#                                                                  a learned
#                                                                  h_i-enemy
#                                                                  pair token.
# - rpg_public_private_bias_transformer_topk_hypercond: same private-bias
#                                                       public Transformer,
#                                                       but only computes
#                                                       interaction Q-values
#                                                       for top-k selected
#                                                       enemy targets.
# - rpg_public_private_bias_transformer_threshold_hypercond: same as above,
#                                                           but keeps targets
#                                                           whose selector
#                                                           probability exceeds
#                                                           clean_target_threshold.
# - rpg_public_past_delta_token_transformer_hypercond: public Transformer with
#                                                      obs_t - obs_{t-1} public
#                                                      delta injected as token
#                                                      embeddings.
# - rpg_public_past_delta_bias_transformer_hypercond: past public delta injected
#                                                     as attention bias.
# - rpg_public_private_bias_past_delta_token_transformer_hypercond: public
#                                                                   Transformer
#                                                                   with obs_t
#                                                                   - obs_{t-1}
#                                                                   public delta
#                                                                   injected as
#                                                                   token
#                                                                   embeddings,
#                                                                   and current
#                                                                   private
#                                                                   local
#                                                                   fields
#                                                                   injected as
#                                                                   attention
#                                                                   bias.
# - rpg_public_private_bias_past_delta_token_transformer_enemy_slot_hypercond:
#                                                                   same mixed
#                                                                   Transformer,
#                                                                   but sends
#                                                                   encoded
#                                                                   enemy slots
#                                                                   from the
#                                                                   Transformer
#                                                                   to the
#                                                                   interaction
#                                                                   head.
# - rpg_public_private_token_past_delta_bias_transformer_enemy_slot_hypercond:
#                                                                   public
#                                                                   Transformer
#                                                                   with current
#                                                                   private
#                                                                   local
#                                                                   fields as
#                                                                   token
#                                                                   embeddings,
#                                                                   obs_t -
#                                                                   obs_{t-1}
#                                                                   public
#                                                                   delta as
#                                                                   attention
#                                                                   bias, and
#                                                                   encoded
#                                                                   enemy slots
#                                                                   passed to
#                                                                   the
#                                                                   interaction
#                                                                   head.
# - rpg_public_private_full_token_transformer_hypercond: public/private
#                                                        semantic fields are
#                                                        encoded separately,
#                                                        fused into full entity
#                                                        tokens, then processed
#                                                        by the public
#                                                        Transformer relation
#                                                        generator.
# - rpg_public_past_delta_bias_transformer_private_head_input_hypercond:
#                                                                   public
#                                                                   Transformer
#                                                                   with past
#                                                                   public delta
#                                                                   as attention
#                                                                   bias, while
#                                                                   private
#                                                                   target
#                                                                   fields are
#                                                                   concatenated
#                                                                   into the
#                                                                   interaction
#                                                                   head input.
# - rpg_global_public_transformer_hypercond: training-only CTDE diagnostic.
#                                            During training, public entity
#                                            fields missing from local
#                                            observations are filled from the
#                                            centralized state; testing still
#                                            uses local observations.
# - rpg_global_public_private_bias_past_delta_token_transformer_hypercond:
#                                            same global-public training
#                                            diagnostic, plus past public
#                                            delta tokens and private attention
#                                            bias.
# - rpg_global_public_private_bias_past_delta_token_transformer_topk_hypercond:
#                                            same as above, but only computes
#                                            interaction Q-values for top-k
#                                            selected enemy targets.
# - rpg_global_public_private_bias_past_delta_token_transformer_threshold_hypercond:
#                                            same as above, but keeps targets
#                                            whose selector probability exceeds
#                                            clean_target_threshold.
# - rpg_public_transformer_relation_token_head_hypercond: public Transformer
#                                                        relation generator,
#                                                        but ego and
#                                                        interaction Q-head
#                                                        inputs use the
#                                                        temporal relation
#                                                        hidden state instead
#                                                        of the policy GRU
#                                                        hidden.
# - rpg_public_private_bias_transformer_relation_token_head_hypercond:
#                                                        same as above, but
#                                                        the relation generator
#                                                        uses public tokens
#                                                        with private
#                                                        attention bias.
# - rpg_public_private_bias_transformer_relation_pair_token_head_hypercond:
#                                                        same private-bias
#                                                        relation generator,
#                                                        but interaction
#                                                        input is [relation,
#                                                        enemy token,
#                                                        relation * enemy].
# - rpg_public_private_bias_transformer_relation_private_token_head_hypercond:
#                                                        same private-bias
#                                                        relation generator,
#                                                        but interaction
#                                                        input is [relation,
#                                                        enemy token, private
#                                                        enemy token].
# - rpg_public_private_bias_transformer_relation_delta_token_head_hypercond:
#                                                        same private-bias
#                                                        relation generator,
#                                                        but interaction
#                                                        input is [relation,
#                                                        enemy token, enemy
#                                                        delta token].
# - rpg_public_private_bias_transformer_slot_token_head_hypercond:
#                                                        same private-bias
#                                                        relation generator,
#                                                        but ego uses
#                                                        [h_t, encoded self slot]
#                                                        and interaction uses
#                                                        [h_t, encoded enemy slot]
#                                                        after private-bias
#                                                        Transformer attention
# - rpg_global_public_transformer_relation_token_head_hypercond: training-only
#                                                        global-public
#                                                        diagnostic plus
#                                                        relation-token head
#                                                        input.
# - rpg_public_private_bias_past_delta_token_transformer_relation_token_head_hypercond:
#                                                        same relation-token
#                                                        head input, with past
#                                                        public delta tokens
#                                                        and private attention
#                                                        bias in the relation
#                                                        Transformer.
# - rpg_public_private_full_token_transformer_relation_token_head_hypercond:
#                                                        same public/private
#                                                        full-token relation
#                                                        generator, but ego
#                                                        and interaction
#                                                        Q-head inputs use the
#                                                        temporal relation
#                                                        hidden state instead
#                                                        of policy GRU hidden.
# - rpg_full_obs_transformer_hypercond: no public/private semantic split. The
#                                       relation Transformer encodes full self,
#                                       ally, and enemy obs slots directly, but
#                                       the decision head still uses the policy
#                                       GRU hidden h_i.
# - rpg_full_obs_transformer_relation_token_head_hypercond: no public/private
#                                                        semantic split. The
#                                                        relation Transformer
#                                                        encodes full self,
#                                                        ally, and enemy obs
#                                                        slots directly, then
#                                                        uses the temporal
#                                                        relation hidden state
#                                                        as the decision-head
#                                                        input.
# - rpg_public_private_bias_past_delta_token_transformer_relation_token_topk_hypercond:
#                                                        same as above, but
#                                                        uses relation-side
#                                                        scores to keep only
#                                                        top-k enemy attack
#                                                        targets.
# - *_single_head_hypercond public Transformer variants: same public Transformer
#                                                       relation generators as
#                                                       the public Transformer
#                                                       variants
#                                                       above, but remove the
#                                                       RPG decision-maker
#                                                       split. The relation
#                                                       condition directly
#                                                       generates a full
#                                                       two-layer Q-head by
#                                                       hypernetwork.
# - rpg_residual_interaction_hypercond: keeps the same generated ego branch,
#                                       then combines a fixed linear
#                                       interaction scorer with a
#                                       relation-generated linear residual.
#                                       A learned gate decides how strongly the
#                                       dynamic correction participates.
# - rpg_film_interaction_hypercond: keeps the generated ego branch, encodes
#                                   [agent hidden, enemy token] with a fixed
#                                   interaction encoder, and lets the relation
#                                   pattern generate FiLM scale/bias
#                                   modulation before the final attack score.
# - rpg_moe_interaction_head: keeps the generated ego branch, but replaces the
#                             generated linear interaction scorer with a soft
#                             mixture of fixed interaction experts selected by
#                             the relation pattern.
# - rpg_smooth_linear_interaction_hypercond: same head structure as
#                                            rpg_linear_interaction_hypercond,
#                                            plus a KNN smoothness regularizer
#                                            encouraging nearby relation
#                                            patterns to generate nearby
#                                            interaction heads.
# - rpg_post_topk_enemy_interaction_hypercond: same relation generator as
#                                             rpg_linear_interaction_hypercond,
#                                             but after relation generation it
#                                             scores enemy targets and keeps
#                                             only top-k targets in the
#                                             interaction branch.
# - rpg_post_threshold_enemy_interaction_hypercond: same as above, but keeps
#                                                   targets whose selection
#                                                   score exceeds
#                                                   clean_target_threshold.
# - rpg_pre_topk_entity_relation_hypercond: before RPG cross-attention, scores
#                                           ally/enemy context entities from
#                                           the self query and keeps top-k
#                                           entities for relation generation.
# - rpg_pre_threshold_entity_relation_hypercond: same pre-relation bottleneck,
#                                                using
#                                                clean_pre_relation_threshold.
# - rpg_no_enemy_token_interaction_hypercond: target-wise sanity ablation. The
#                                             interaction branch keeps the
#                                             generated scorer but removes
#                                             target-specific enemy tokens.
# - rpg_private_enemy_token_interaction_hypercond: replaces interaction enemy
#                                                  tokens with private target
#                                                  fields such as relative
#                                                  geometry and availability.
# - rpg_delta_enemy_token_interaction_hypercond: concatenates the original
#                                                enemy token with an encoded
#                                                enemy-feature delta
#                                                obs_t - obs_{t-1}.
# - rpg_dual_branch_relation_hypercond: full-observation Linear and entity
#                                      self-attention branches, concatenated
#                                      and linearly fused into the condition.
# - rpg_dual_branch_td_benefit_drop_hypercond: same dual baseline; a signed
#                                      keep-vs-drop TD counterfactual removes
#                                      one harmful branch/semantic group at a time.
# - rpg_dual_branch_parameter_invariant_drop_hypercond: same dual baseline;
#                                      removes a branch/semantic group only when
#                                      generated hypernetwork parameters barely change.
# - rpg_dual_branch_cstg_gate_hypercond: current local obs generates separate
#                                      Linear/Attention slot gates at every
#                                      timestep using conditional-STG Gaussian
#                                      perturbation and clipping.
# - rpg_dual_branch_bayesg_gate_hypercond: same observation-conditioned dual
#                                      gates, using BayesG's Gumbel-sigmoid
#                                      relaxation and deterministic eval threshold.
# - rpg_dual_branch_hard_gate_hypercond: observation-conditioned dual gates
#                                      with one independent decision per raw
#                                      scalar and exact 0/1 forward masks. A sigmoid
#                                      straight-through estimator supplies
#                                      gradients, with identical train/eval rules.
# - grf_abs_dual_branch_hard_gate_grad_consistency_hypercond: Counter hard-gate
#                                      variant. It samples a few adjacent
#                                      timesteps and aligns their TD gradients
#                                      in the low-dimensional condition space.
# - grf_abs_dual_branch_hard_gate_param_stability_hypercond: Counter hard-gate
#                                      variant using the exact adjacent-step L1
#                                      change of every generated weight and bias.
#   The corresponding SMAC Corridor variants use the same suffixes without
#   grf_abs_: rpg_dual_branch_hard_gate_{param_stability,grad_consistency}_hypercond.
# - *_dual_branch_binary_concrete_{param_stability,grad_consistency}_hypercond:
#                                      same auxiliary targets with stochastic
#                                      continuous Binary-Concrete gates during
#                                      gradient-enabled training, deterministic
#                                      probability gates for target forwards,
#                                      and exact 0/1 evaluation masks.
# - *_dual_branch_hard_gate_adaptive_{param_stability,grad_consistency}_hypercond:
#                                      keep hard STE gates and adapt the detached
#                                      EMA-weighted auxiliary term to a fixed
#                                      fraction of TD loss.
# - grf_abs_single_transformer_branch_hypercond: Counter structural control;
#                                      keeps the dual baseline's full-observation
#                                      entity Transformer branch and removes the
#                                      Linear branch, fusion layer, and gates.
# - grf_abs_dual_branch_binary_concrete_td_only_entity_three_head_hypercond:
#                                      TD-only Concrete-gated dual condition.
#                                      Its action module separately encodes raw
#                                      self, ball, ally, and opponent fields,
#                                      then generates ego/ball-control, pass,
#                                      and slide heads with action partitions
#                                      15/3/1. These raw entity encoders are
#                                      independent of the gated Transformer.
# - grf_abs_dual_branch_binary_concrete_td_only_ball_interaction_two_head_hypercond:
#                                      TD-only Concrete-gated dual condition with
