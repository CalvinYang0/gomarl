#                                       the entity self-attention block, then
#                                       lets the self token select the top-k
#                                       observed entities for relation-pattern
#                                       pooling. Attack Q-values are still
#                                       produced for every enemy action slot.
# - rpg_action_edge_graph_hypercond: relation-generator ablation. It builds a
#                                    graph whose nodes are public entity states
#                                    and whose edges are predicted action
#                                    intents. The action predictor reads
#                                    obs_{t-1}, obs_t, and delta obs, and is
#                                    supervised by current actions as an
#                                    auxiliary loss.
# - rpg_action_edge_rgcn_hypercond: action-edge graph variant. It keeps the
#                                   same nodes and predicted action edges, but
#                                   extracts graph information with an
#                                   R-GCN-style relation transform where action
#                                   ids define edge relation types.
# - rpg_action_edge_egcn_hypercond: action-edge graph variant. It keeps the
#                                   same nodes and predicted action edges, but
#                                   uses edge-conditioned message gates so
#                                   action probabilities and action embeddings
#                                   directly modulate graph messages.
# - rpg_action_edge_egcn_plus_public_pred_hypercond: EGCN+ action-edge graph
#                                                    variant. It predicts edges
#                                                    from public entity state,
#                                                    encodes edge features from
#                                                    raw action probabilities
#                                                    instead of action id
#                                                    embeddings, and injects
#                                                    graph-updated enemy tokens
#                                                    into target scoring.
# - rpg_action_edge_oracle_graph_hypercond: oracle diagnostic. During training
#                                           only, true current actions replace
#                                           predicted actions when constructing
#                                           graph edges. Test execution falls
#                                           back to predicted edges.
# - rpg_action_edge_oracle_no_self_hypercond: oracle diagnostic that also
#                                             removes the special self encoder;
#                                             the acting agent is encoded as an
#                                             ordinary ally node.
# - rpg_action_edge_prev_oracle_graph_hypercond: oracle diagnostic using
#                                                previous-step true actions as
#                                                graph edges during training,
#                                                avoiding current-action
#                                                leakage before action choice.
# - rpg_action_edge_public_pred_hypercond: action-edge graph variant whose
#                                          action predictor reads only public
#                                          entity state rather than full local
#                                          observations.
# - rpg_action_edge_public_pred_public_hyper_private_input_single_head:
#     action-edge public-pred condition generates a full single Q-head, while
#     private local information enters the generated head input.
# - rpg_action_edge_public_pred_private_hyper_public_input_single_head:
#     private local information generates a full single Q-head, while the
#     action-edge public-pred condition enters the generated head input.
# - rpg_action_edge_public_pred_coarse_fine_four_layer_head:
#     action-edge public-pred condition generates the first two MLP layers and
#     self/private information generates the last two layers.
# - rpg_action_edge_public_pred_coarse_q_fine_gate_head:
#     action-edge public-pred condition generates coarse Q-values and
#     self/private information generates an action-wise fine gate.
# - rpg_action_edge_public_pred_relation_private_single_head:
#     action-edge public-pred relation condition is concatenated with embedded
#     private local view information to generate a full two-layer Q-head. This
#     removes the structured decision maker.
# - rpg_action_edge_public_pred_relation_private_decision_maker:
#     uses the same relation+private generation condition as above, but keeps
#     the structured ego-action / interaction-action decision maker.
# - rpg_action_edge_graphormer_relation_private_single_head:
#     replaces action-edge message passing with a Graphormer-style Transformer
#     over self/ally/enemy nodes, using action-edge pair bias and centrality.
# - rpg_action_edge_graphit_relation_private_single_head:
#     replaces action-edge message passing with a GraphiT-style Transformer
#     whose attention bias comes from a random-walk/diffusion graph kernel.
# - rpg_action_edge_edgeset_relation_private_single_head:
#     encodes action-edge structure by adding edge tokens
#     [actor node, enemy node, attack probability] to a Transformer.
# - rpg_action_edge_motif_transformer_relation_private_single_head:
#     encodes higher-order action motifs, e.g. ally co-focus and enemy pressure,
#     as Transformer attention bias and node structural features.
# - rpg_action_edge_public_memory_hypercond: public-predictor variant that
#                                            fills currently missing public
#                                            entity slots with their previous
#                                            observed public values.
# - rpg_action_edge_global_public_pred_hypercond: training diagnostic. During
#                                                 non-test rollouts/training it
#                                                 fills public entity state from
#                                                 centralized state; test still
#                                                 uses local observations.
# - rpg_action_edge_target_context_hypercond: target-level graph variant. It
#                                             adds graph-updated enemy tokens
#                                             to attack-target tokens before
#                                             the structured maker.
# - rpg_action_edge_coarse_private_fine_gate_hypercond: decision-maker variant.
#                                                       The action-edge graph
#                                                       condition generates a
#                                                       coarse full Q-head, and
#                                                       private self/local
#                                                       information generates
#                                                       an action-wise fine
#                                                       gate.
# - rpg_public_hyper_private_input_single_head: single-head ablation. Public
#                                               entity information generates a
#                                               full two-layer MLP Q-head while
#                                               private local information is
#                                               encoded into the head input.
# - rpg_private_hyper_public_input_single_head: single-head ablation with the
#                                               roles reversed: private local
#                                               information generates the head
#                                               while public entity information
#                                               enters the head input.
# - rpg_delta_relation_hypercond: relation-generator ablation. It removes the
#                                 relation GRU and instead combines the instant
#                                 relation pattern with an explicit
#                                 obs_t - obs_{t-1} embedding. The policy GRU
#                                 is unchanged.
# - rpg_relation_coarse_self_fine_head: decision-maker ablation. It removes the
#                                       ego/interaction split and uses the
#                                       relation pattern to generate a coarse
#                                       full MLP Q-head, while self features
#                                       generate a small final-layer delta for
#                                       fine-grained agent-specific tuning.
# - rpg_relation_coarse_fine_four_layer_head: decision-maker ablation. It uses
#                                             relation pattern to generate the
#                                             first two MLP layers and self
#                                             features to generate the last two
#                                             layers, avoiding direct weight
#                                             addition between coarse and fine
#                                             generators.
# - rpg_relation_coarse_q_fine_gate_head: decision-maker ablation. It first
#                                         uses relation pattern to generate a
#                                         coarse Q-head, then uses self features
#                                         to generate an action-wise gate that
#                                         suppresses less relevant actions.
# - rpg_relation_prototype_single_head: decision-maker ablation. It removes the
#                                       ego/interaction split and routes each
#                                       relation pattern to one of K learned
#                                       prototype conditions before generating
#                                       a full MLP Q-head.
# - rpg_fixed_structured_maker: relation-pattern structured maker with no
#                               generated decision parameters. The ego branch
#                               and enemy-interaction branch are both fixed
#                               MLPs conditioned by concatenating the relation
#                               pattern to their inputs.
# - rpg_fixed_linear_structured_maker: fixed structured-maker control. It keeps
#                                      the fixed two-layer ego branch, but uses
#                                      a single fixed linear layer for each
#                                      enemy-interaction score, conditioned by
#                                      concatenating the relation pattern.
# - two_graph_gat_hypercond: CTDE ego-graph GAT counterpart to
#                            rpg_relation_hypercond. It replaces RPG-style
#                            first-person cross-attention with two explicit
#                            local GAT graphs, self+allies and self+enemies,
#                            then uses the resulting relation condition to
#                            generate the unified dynamic head.
# - hetero_gat_hypercond: CTDE ego-heterogeneous GAT counterpart to
#                         rpg_relation_hypercond. It uses typed self-loop,
#                         ally->self, and enemy->self messages with type-level
#                         attention, then uses the resulting relation condition
#                         to generate the unified dynamic head.
# - global_two_graph_gat_hypercond: CTCE whole-graph upper-bound model. It
#                                   computes one friendly graph and one enemy
#                                   graph per timestep, then uses cross-graph
#                                   attention so friendly nodes can read enemy
#                                   graph context before head generation.
# - global_hetero_gat_hypercond: CTCE whole-graph upper-bound model. It puts
#                                friendly and enemy nodes into one typed graph
#                                with node-type and edge-type embeddings before
#                                generating the dynamic head condition.
# - graph_hypercond: obs-only graph + standard GCN -> hypernetwork condition (currently CTCE validation)
# - graph_route: obs-only graph + standard GCN -> route/codebook (currently CTCE validation)
# - qmix_minimal: shared trunk + fixed two-layer MLP head, no hypernetwork (CTDE)
clean_model_type: "baseline"
clean_apply_hypermarl_init: False
clean_condition_dim: 64
clean_id_embed_dim: 64
clean_hyper_mlp_hidden_dim: 64
clean_rpg_interaction_hidden_dim: 16
clean_rpg_interaction_experts: 4
clean_rpg_residual_gate_bias: -1.0
clean_stable_residual_gate_bias: -3.0
clean_stable_residual_l2_coef: 0.001
clean_self_fine_delta_scale: 0.1
clean_self_fine_gate_scale: 1.0
clean_relation_prototypes: 4
clean_relation_topk: 5
clean_target_topk: 5
clean_target_threshold: 0.5
clean_pre_relation_threshold: 0.5
clean_action_pred_loss_coef: 0.05
clean_public_delta_loss_coef: 0.05
clean_public_transformer_layers: 1
clean_public_transformer_heads: 4
clean_public_transformer_delta_loss_coef: 0.05
clean_semantic_router_ema: 0.99
# Optional asymmetric EMA. Lower `ema_up` lets newly important slots recover
# quickly; higher `ema_down` avoids dropping slots after a transient decrease.
clean_semantic_router_ema_up: 0.99
clean_semantic_router_ema_down: 0.99
# Accumulate importance continuously but deploy a new route at most once per
# this many environment timesteps. Zero preserves the legacy per-update route.
clean_semantic_router_update_interval: 0
# Critical-state GIMP uses per-state input-gradient attribution. These settings
# combine the regular-state mean with the most influential 10% of states, allow
# important fields to recover quickly, and deploy routes at a lower frequency.
clean_semantic_critical_tail_fraction: 0.1
clean_semantic_critical_tail_weight: 0.5
clean_semantic_critical_ema_up: 0.5
clean_semantic_critical_ema_down: 0.99
clean_semantic_critical_update_interval: 8000
# Critical-state routing is soft: p enters TOKEN and 1-p enters BIAS. This
# temperature controls the continuous importance-to-weight mapping.
clean_semantic_critical_temperature: 0.5
# Every raw observation slot is routed independently. TOKEN/BIAS branch counts
# are learned rather than fixed; higher values make TOKEN admission stricter.
clean_semantic_router_threshold: 0.5
clean_semantic_router_temperature: 0.1
# Stochastic hard MLP routing keeps a nonzero chance of restoring low-score
# slots during training; evaluation uses a deterministic probability threshold.
clean_semantic_stochastic_exploration_floor: 0.05
# Discovery begins with every raw observation slot on the TOKEN branch. After
# warmup, the selected criterion updates the route as before.
clean_semantic_router_warmup_steps: 250000
# Keep adapting while the policy and hypernetwork become meaningful; early TD
# and generated-parameter signals are too noisy to freeze at 1.5M.
clean_semantic_router_freeze_steps: 5000000
# Direct/hierarchical DROP keeps only slots above this importance score.
clean_semantic_router_keep_threshold: 0.35
# Sparse DROP keeps this fixed fraction of highest-scoring raw slots.
clean_semantic_router_keep_ratio: 0.5
# STR uses this activity penalty to prefer exact-zero semantic gates.
clean_semantic_router_sparse_coef: 0.001
# Stage two accepts the exact first-stage route in internal slot order, for
# example "0011...", and builds compact branch encoders from selected fields.
clean_semantic_router_fixed_mask: ""
clean_semantic_router_audit_interval: 250000
clean_semantic_binary_audit_batch_size: 8
clean_semantic_binary_rehearsal_updates: 4
clean_semantic_parameter_probe_timesteps: 4
clean_semantic_observation_probe_timesteps: 8
# Dual Linear + self-attention branch pruning uses signed, absolute
# counterfactual criteria rather than relative importance rankings. At each
# audit it changes at most one shared semantic group, then re-audits under the
# new mask to avoid deleting the same redundant signal from both branches.
clean_branch_drop_task_margin: 0.01
clean_branch_drop_parameter_threshold: 0.01
clean_branch_drop_ema: 0.9
clean_branch_drop_warmup_steps: 250000
clean_branch_drop_freeze_steps: 5000000
# Observation-conditioned dual-gate defaults. Individual sparse variants add
# Bernoulli-KL, hard-concrete L0, perturbation, or TD-gradient objectives while
# preserving the same gate MLP and warm-up.
clean_dynamic_branch_gate_hidden_dim: 64
clean_cstg_gate_sigma: 0.5
clean_bayesg_gate_temperature: 0.5
clean_binary_concrete_temperature: 0.5
# This intentionally matches BayesG's GraphMaskGenerator implementation.
clean_bayesg_gate_eval_threshold: 0.08
# Sparse binary-concrete experiments: KL80 can be evaluated with a 0.7 hard
# threshold, KL70 with a 0.5 threshold, and bimodal_budget80 keeps the mean
# probability near 0.8 while minimizing per-slot Bernoulli entropy.
clean_dynamic_gate_entropy_coef: 1.0
clean_dynamic_gate_budget_coef: 10.0
# Corrected dynamic-gate baseline. It starts as a full-observation model and
# enables independent deterministic scalar decisions only after the dual
# condition has warmed up.
clean_hard_gate_threshold: 0.5
clean_hard_gate_initial_keep_probability: 0.55
# Number of timesteps captured from the first deterministic test trajectory
# for the W&B slot-wise drop-probability plot.
clean_test_gate_trajectory_max_steps: 256
# Fit a visualization-only PCA to the exact generated hypernetwork parameters
# collected from the same deterministic test trajectory. Each timestep is one
# point; this does not add a model projection or affect optimization.
wandb_test_parameter_pca: True
clean_dynamic_branch_gate_warmup_steps: 250000
clean_importance_auxiliary_warmup_steps: 250000
# REFIL-inspired random observation masking auxiliary. The ordinary TD path
# remains unchanged; a second masked rollout trains observation-loss robustness.
clean_random_drop_auxiliary_keep_probability: 0.8
clean_random_drop_auxiliary_coef: 0.5
# episode: one Bernoulli mask is reused across the sampled sequence;
# timestep: a fresh mask is sampled at every timestep.
clean_random_drop_auxiliary_scope: episode
clean_random_drop_auxiliary_combine_mode: replace
clean_parameter_perturbation_relative_std: 0.05
clean_parameter_perturbation_probe_timesteps: 2
# Per-timestep generated-head robustness objective. The noise scale is the
# detached RMS of each generated parameter block, so the model cannot reduce
# the auxiliary simply by shrinking the scale estimator itself.
clean_perturbed_head_relative_std: 0.05
clean_perturbed_head_minimum_rms: 0.001
# Relative generated-parameter change margin. The small-change variant only
# suppresses changes below half this margin; larger changes receive zero
# auxiliary gradient and are judged solely by TD loss.
clean_temporal_param_switch_margin: 0.1
clean_temporal_param_scale_eps: 0.000001
# Scale that maps normalized generated-parameter distance d_theta to the
# bounded relation target d_theta / (d_theta + scale).  The relation loss
# regresses the observation-conditioned mask distance to this detached target,
# and is differentiated only with respect to the gate network.
clean_mask_parameter_relation_scale: 0.1
# fixed: adjacent + deterministic non-local pairs; episode_random: random
# pairs within each episode; global_random: random pairs across the replay batch.
clean_mask_parameter_relation_pairing: fixed
# probability compares sigmoid keep probabilities; sampled_gate compares the
# stochastic Binary-Concrete values actually applied to the observation.
clean_mask_parameter_relation_mask_source: probability
# Fixed gate-only weights for relation-family variants. These are intentionally
# independent: the smaller temporal loss must not be diluted by the larger
# relation loss through a shared adaptive coefficient.
clean_mask_parameter_relation_coef: 10.0
clean_mask_parameter_relation_temporal_coef: 50.0
clean_mask_parameter_relation_perturbed_head_coef: 1.0
clean_mask_parameter_relation_gate_regularization_coef: 1.0
# Optional decoupled importance training. After the ordinary gate warm-up,
# alternate 80k environment steps of TD-only non-gate updates with 20k steps
# where only the gate receives TD plus its importance auxiliary.
clean_importance_alternating_training: false
clean_importance_non_gate_phase_steps: 80000
clean_importance_gate_phase_steps: 20000
# Print one test-set mean probability per raw slot to the server log.
clean_print_test_slot_probabilities: true
# Counter-only condition-gradient auxiliary. It is deliberately conservative:
# two adjacent pairs per learner update, enabled only after gate warmup.
clean_condition_gradient_consistency_coef: 0.1
clean_condition_gradient_consistency_pairs: 2
clean_condition_gradient_consistency_warmup_steps: 250000
clean_generated_parameter_stability_coef: 0.1
clean_generated_parameter_stability_warmup_steps: 250000
clean_generated_parameter_likelihood_std: 1.0
clean_generated_parameter_likelihood_warmup_steps: 250000
clean_td_parameter_relative_std: 0.02
clean_td_parameter_minimum_rms: 0.01
clean_td_weighted_parameter_likelihood_coef: 0.01
clean_td_weighted_parameter_likelihood_warmup_steps: 250000
clean_trajectory_parameter_projection_dim: 64
clean_trajectory_parameter_likelihood_warmup_steps: 250000
# Adaptive variants target a 10% auxiliary/TD scalar-loss ratio. EMA values and
# the derived coefficient are detached from autograd; the cap is only a guard
# against invalid/near-zero auxiliary batches.
clean_adaptive_auxiliary_target_ratio: 0.1
clean_adaptive_auxiliary_ema_decay: 0.99
clean_adaptive_auxiliary_eps: 0.00000001
clean_adaptive_auxiliary_max_coef: 100.0
clean_relation_distill_coef: 0.05
clean_relation_teacher_td_coef: 0.2
clean_smooth_head_loss_coef: 0.01
clean_smooth_head_knn: 4
clean_smooth_head_sample_size: 256
# Optional training-only credit gate. When enabled with a relation-conditioned
# clean model, the learner multiplies each agent's selected Q by a positive
# relation-pattern gate before the QMIX mixer. This remains CTDE because the
# mixer is not used during decentralized execution.
clean_relation_mixer_gate: False
clean_route_num: 4
clean_route_temperature: 1.0
clean_rpg_relation_dim: 64
clean_graph_node_dim: 64
clean_graph_layers: 1
clean_graph_topk: null

lr: 0.001
td_lambda: 0.6

name: "clean_hyper_baseline"
