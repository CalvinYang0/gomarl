# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: "parallel"
run: "interval_run"
batch_size_run: 8
buffer_size: 5000 
batch_size: 128
optimizer: 'adam'

t_max: 10050000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "group_mac"
agent: "n_group"
agent_output_type: q

learner: "group_learner"
mixer: "group"                     # group | group_vdn
mixing_embed_dim: 32
hypernet_embed: 32
grouping_hypernet_embed: 32
group_head_mode: "latent"         # latent | plain | fixed_group | graph_better_struct | graph_better_struct_proto | graph_better_struct_repr | graph_better_struct_slow | graph_better_struct_sparse | graph_better_struct_hybrid | graph_better_struct_row_sparse | graph_better_struct_topk_signature | graph_better_struct_ego_subgraph | graph_input_fusion | graph_input_fusion_node_embed | graph_input_fusion_node_embed_two_layer_head | graph_input_fusion_node_embed_no_groupemb | graph_input_fusion_node_embed_no_groupemb_no_group | graph_input_fusion_node_embed_no_reg | graph_input_fusion_node_embed_no_groupemb_no_reg | graph_input_fusion_node_embed_struct_only | graph_input_fusion_node_embed_sharp | graph_input_fusion_node_embed_threshold_group | graph_input_fusion_fixed_group | graph_input_fusion_group_only | graph_input_fusion_head_only | graph_input_fusion_hidden_head | graph_input_fusion_node_embed_head | graph_input_fusion_struct_feat_head | graph_input_fusion_node_embed_struct_feat_head | graph_input_fusion_node_embed_struct_feat_two_layer_head | graph_input_fusion_node_embed_struct_feat_bottleneck_head | graph_input_fusion_node_embed_struct_feat_full_head | graph_input_fusion_node_embed_struct_feat_full_head_early_node | graph_input_fusion_node_embed_struct_feat_full_head_residual | graph_input_fusion_node_embed_struct_feat_decoupled_head | graph_input_fusion_node_embed_struct_feat_decoupled_residual_head | graph_input_fusion_node_embed_gcn_full_head | graph_input_fusion_node_embed_subgraph_full_head | graph_input_fusion_node_embed_struct_feat_full_model | graph_input_fusion_node_embed_group_full_head (hyphen aliases supported)
full_head_local_ctde: False       # when True and full-head mode is selected, skip A×A graph build and use per-agent local features only (same train/test input space)
full_head_variant: "dynamic"      # dynamic | episode_once_head | kstep_head | no_struct | tri_branch | distill | ptde_strict | distill_q_teacher_td | teacher_td_qdistill | teacher_td_featdistill | teacher_td_multidistill | distill_head | distill_head_teacher_td | belief_cond | pid_dropout | ema_step | ema_ep_param_mean | ema_ep_struct_mean | grad_decouple | rf | hypermarl_rf | id_cond | gcn | neighbor_agg | standard_gcn | gat | temporal_gnn | edge_gnn | relation_gnn | hetero_enemy
full_head_update_interval: 5      # only used when full_head_variant=kstep_head, recompute dynamic head every k steps within an episode
full_head_train_stage: "joint"   # joint | teacher | student | two_stage, mainly used by teacher-only distillation variants
full_head_two_stage_teacher_tmax: 5000000  # when full_head_train_stage=two_stage, switch from teacher to student after this many env steps
full_head_distill_alpha: 0.2      # used by distill / ptde_strict / distill_q_teacher_td / teacher_td_qdistill / teacher_td_featdistill / teacher_td_multidistill / distill_head / distill_head_teacher_td / pid_dropout / belief_cond
full_head_teacher_td_alpha: 1.0   # used by teacher-TD distill variants
full_head_student_stopgrad: False # when True, block student distill gradients from flowing back into shared node/h features
full_head_apply_rf_init: False    # when True, apply the RF fan init to the current full-head generators, including teacher/student distill heads
full_head_belief_kl_alpha: 0.01   # only used when full_head_variant=belief_cond
full_head_belief_latent_dim: 32   # only used when full_head_variant=belief_cond
full_head_pid_start: 0.0          # only used when full_head_variant=pid_dropout
full_head_pid_end: 0.5            # only used when full_head_variant=pid_dropout
full_head_pid_anneal_steps: 2000000  # only used when full_head_variant=pid_dropout
full_head_param_ema_beta: 0.99    # used by all EMA variants (ema_step / ema_ep_param_mean / ema_ep_struct_mean)
full_head_use_ema_in_test: True   # test-time fixed-parameter switch for EMA variants
full_head_rf_fan_mode: "fan_in"   # only used when full_head_variant=rf, options: fan_in | fan_out | fan_in_out
full_head_relation_num: 4         # only used when full_head_variant=relation_gnn
full_head_hetero_enemy_nodes: 0   # only used when full_head_variant=hetero_enemy, <=0 means auto-infer
dynamic_residual_scale: 0.3
group_num: 3
group_assignment_tau: 1.0
graph_attention_tau: 0.5
group_balance_alpha: 0.01
group_conf_alpha: 0.001
group_sparse_alpha: 0.001
group_similarity_alpha: 0.01
group_similarity_pos_threshold: 0.7
group_similarity_neg_threshold: 0.3
group_proto_compact_alpha: 0.01
group_proto_sep_alpha: 0.01
group_ema_alpha: 0.8
group_sparse_topk: null
group_direct_topk: 3

lr: 0.001                           # Learning rate for agents
td_lambda: 0.6
optimizer: 'adam'
group_mode: "dynamic"              # dynamic | one_group | singletons | same_type | manual
group: null                         # manual initial group, e.g. [[0,1],[2,3]]
group_adjustment_mode: "contribution"  # contribution | graph_pseudo_attn | graph_local_subgraph | graph_local_fusion
change_group_interval: 100000
change_group_batch_num: 4           # change group data 256*4
change_group_batch_size: 256
change_group_value: 0.7             # change group when w1 < average * change_group_value
graph_change_group_batch_num: 1
graph_change_group_batch_size: 32
graph_local_neighbor_topk: null     # null -> floor(n_agents/2) local neighbors per agent
graph_topk: null                    # null -> floor(n_agents/2)
graph_edge_threshold: 0.12
visualize_group_graph: False        # upload test-time group graph video/image to W&B
visualize_group_graph_max_frames: 24
visualize_group_graph_fps: 4

lasso_alpha_anneal_time: 100000
lasso_alpha_start: 0.005
lasso_alpha_anneal: 0.96
sd_alpha: 0.005

name: "group_env=8_adam_td_lambda"
